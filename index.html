<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
</head>
  
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-calendar-check text-indigo-600 text-3xl"></i>
                <h1 class="text-xl font-bold text-slate-900">Jadwal Kuliah Informatika</h1>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <select id="classSelector" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:w-40 p-2.5 shadow-sm transition-colors">
                    <!-- Options populated via JS -->
                </select>
                
                <button id="toggleEditBtn" class="flex items-center justify-center gap-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 hover:text-indigo-600 font-medium rounded-lg text-sm px-4 py-2.5 transition-all shadow-sm whitespace-nowrap">
                    <i class="ph ph-pencil-simple text-lg"></i>
                    <span id="editBtnText">Mode Edit</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-slate-900" id="currentClassTitle">Kelas 1A</h2>
                <p class="text-slate-500 text-sm mt-1">Semester Ganjil</p>
            </div>
            <button id="resetDataBtn" class="hidden items-center gap-1 text-sm text-red-600 hover:text-red-700 font-medium">
                <i class="ph ph-arrow-counter-clockwise"></i> Reset Data Awal
            </button>
        </div>

        <div id="scheduleContainer" class="space-y-8">
            <!-- Schedule grouped by day will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <i class="ph-fill ph-calendar-x text-6xl text-slate-300 mb-4"></i>
            <h3 class="text-lg font-medium text-slate-900">Tidak ada jadwal</h3>
            <p class="text-slate-500 mt-1">Belum ada jadwal untuk kelas ini.</p>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-pencil-line text-indigo-500"></i> Edit Jadwal
                </h3>
                <button type="button" id="closeModalBtn" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            
            <form id="editForm" class="p-6 space-y-4">
                <input type="hidden" id="editId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Hari</label>
                        <select id="editDay" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Waktu</label>
                        <input type="text" id="editTime" placeholder="Contoh: 07.00 - 08.40" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Mata Kuliah</label>
                    <input type="text" id="editSubject" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Dosen Pengampu</label>
                    <input type="text" id="editLecturer" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Ruangan</label>
                    <input type="text" id="editRoom" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" id="cancelBtn" class="px-5 py-2.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:ring-4 focus:outline-none focus:ring-slate-200">
                        Batal
                    </button>
                    <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center w-full max-w-xs p-4 space-x-3 text-slate-500 bg-white rounded-lg shadow border border-slate-100 z-50" role="alert">
        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg">
            <i class="ph-fill ph-check-circle text-xl"></i>
        </div>
        <div id="toastMessage" class="ml-3 text-sm font-medium text-slate-800">Berhasil disimpan.</div>
    </div>

    <script src="index.js"></script>
  
</body>
</html>
